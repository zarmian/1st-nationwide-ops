name: Nexus sync

# Logs into the Nexus portal, downloads the latest sites export, and posts it to
# the app's secure import endpoint (/api/imports/nexus). Runs on a schedule and
# can be triggered by hand from the Actions tab (Run workflow) for testing.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   NEXUS_USERNAME  (or NEXUS_PORTAL_USERNAME)   portal login
#   NEXUS_PASSWORD  (or NEXUS_PORTAL_PASSWORD)   portal password
#   NEXUS_IMPORT_URL      https://1st-nationwide-ops.vercel.app/api/imports/nexus
#   NEXUS_IMPORT_SECRET   same value set as NEXUS_IMPORT_SECRET in Vercel
# (NEXUS_PORTAL_URL is not required — the report page is built in; override with
#  NEXUS_REPORT_URL only if it ever moves.)
#
# Optional overrides (login is already pinned to link.linkbynexus.co.uk):
#   NEXUS_REPORT_URL      defaults to https://link.linkbynexus.co.uk/Reports/Sites
#   NEXUS_EXPORT_URL      a direct export/download link, if the report has one
#   NEXUS_EXPORT_SELECTOR the export button, if auto-detect doesn't find it
#
# See docs/nexus-sync.md for the one-time setup.

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC daily (adjust as needed)
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (don't write to the app)"
        type: boolean
        default: false

concurrency:
  group: nexus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Run Nexus sync
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME || secrets.NEXUS_PORTAL_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PORTAL_PASSWORD }}
          NEXUS_IMPORT_URL: ${{ secrets.NEXUS_IMPORT_URL }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
          NEXUS_REPORT_URL: ${{ secrets.NEXUS_REPORT_URL }}
          NEXUS_EXPORT_URL: ${{ secrets.NEXUS_EXPORT_URL }}
          NEXUS_EXPORT_SELECTOR: ${{ secrets.NEXUS_EXPORT_SELECTOR }}
          NEXUS_ACTIVE_FILTER_SELECTOR: ${{ secrets.NEXUS_ACTIVE_FILTER_SELECTOR }}
          NEXUS_ACTIVE_FILTER_VALUE: ${{ secrets.NEXUS_ACTIVE_FILTER_VALUE }}
          NEXUS_PREVIEW: ${{ inputs.preview }}
        run: node scripts/nexus-sync.mjs

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-sync-debug
          path: |
            nexus-*.png
            nexus-*.html
          if-no-files-found: ignore
          retention-days: 7
