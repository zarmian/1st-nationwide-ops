name: Partner syncs

# About every 4 hours, one after the other in a single run:
#   1. Nexus callouts      — dashboard "Upcoming Activities" → open VPI job stubs
#   2. Nexus activities    — completed activities, last 3 days → completed stubs
#   3. Keyholding jobs     — Chase2Base jobs, last 3 days → next 7 days
#   4. FastField forms     — our officers' FastField reports, last 3 days →
#                            attached to their activities (forms switched on
#                            at /admin/fastfield only)
#
# One job instead of four: the browser is installed once and GitHub bills one
# rounded-up job, which keeps the private repo inside the free Actions minutes
# (see docs/system/13-crons.md). Each sync still has its own workflow
# (nexus-callouts.yml / nexus-activities.yml / keyholding-jobs.yml /
# fastfield-forms.yml) for running it by hand with Preview or a date window.
# The Nexus site list syncs daily in nexus-sync.yml.
#
# A failing sync doesn't stop the others; the run is marked failed afterwards
# (so GitHub emails the owner) and the captures are kept for 1 day.
#
# Secrets: the same ones the four individual workflows use.
#
# Backup start times: GitHub skips or delays a lot of scheduled runs, so
# there's a backup start time between each pair of regular ones. Every
# scheduled run first checks when the syncs last ran, and stops there (about
# a minute of Actions time) if that was under 3 hours ago. So the syncs still
# run about every 4 hours, and a run GitHub skipped is made up within about
# 2 hours instead of 4. A run started by hand always syncs.

on:
  schedule:
    - cron: "7 1-23/4 * * *" # 01:07 05:07 09:07 13:07 17:07 21:07 UTC
    - cron: "37 3-23/4 * * *" # backups: 03:37 07:37 11:37 15:37 19:37 23:37 UTC
  workflow_dispatch:

permissions:
  contents: read # check out the robots
  actions: read # see when the syncs last ran

concurrency:
  group: partner-syncs # shared with the three manual workflows so imports never overlap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04 # not ubuntu-latest: see scripts/install-browser.sh
    timeout-minutes: 45
    steps:
      # A scheduled run stops here if the syncs ran under 3 hours ago (see
      # "Backup start times" above). Only an explicit "due=false" stops the
      # run: if this check can't tell, or breaks, the syncs run as usual.
      - name: Check when the syncs last ran
        id: due
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          if [ "$EVENT" != "schedule" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The start of the latest earlier run that really synced (not one that stopped here).
          last=""
          if ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/partner-syncs.yml/runs?status=completed&per_page=12" \
              --jq '.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | .id'); then
            for id in $ids; do
              case "$id" in "" | *[!0-9]*) break ;; esac
              t=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[].steps[] | select(.name == "Nexus callouts" and .conclusion != "skipped")][0].started_at // empty') || break
              if [ -n "$t" ]; then last="$t"; break; fi
            done
          fi
          last_s=""
          [ -n "$last" ] && last_s=$(date -u -d "$last" +%s 2>/dev/null)
          case "$last_s" in "" | *[!0-9]*) last_s="" ;; esac
          if [ -n "$last_s" ] && [ $(( $(date -u +%s) - last_s )) -lt 10800 ]; then
            echo "The syncs last ran at $last, under 3 hours ago, so this run stops here."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            shown="an unknown time"; [ -n "$last_s" ] && shown="$last"
            echo "The syncs last ran at $shown. Syncing now."
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.due.outputs.due != 'false'

      - uses: actions/setup-node@v7
        if: steps.due.outputs.due != 'false'
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        if: steps.due.outputs.due != 'false'
        timeout-minutes: 15
        run: bash scripts/install-browser.sh

      # "Check when the syncs last ran" finds earlier syncs by this step's
      # name. If it's renamed there, every run simply syncs.
      - name: Nexus callouts
        id: callouts
        if: steps.due.outputs.due != 'false'
        continue-on-error: true
        timeout-minutes: 10
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME || secrets.NEXUS_PORTAL_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PORTAL_PASSWORD }}
          NEXUS_DASHBOARD_URL: ${{ secrets.NEXUS_DASHBOARD_URL }}
          NEXUS_CALLOUTS_URL: ${{ secrets.NEXUS_CALLOUTS_URL }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
        run: node scripts/nexus-callouts.mjs

      - name: Nexus completed activities
        id: activities
        if: steps.due.outputs.due != 'false'
        continue-on-error: true
        timeout-minutes: 15
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME || secrets.NEXUS_PORTAL_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PORTAL_PASSWORD }}
          NEXUS_ACTIVITIES_URL: ${{ secrets.NEXUS_ACTIVITIES_URL }}
          NEXUS_ACTIVITIES_IMPORT_URL: ${{ secrets.NEXUS_ACTIVITIES_IMPORT_URL }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
        run: node scripts/nexus-activities.mjs

      - name: Keyholding jobs
        id: keyholding
        if: steps.due.outputs.due != 'false'
        continue-on-error: true
        timeout-minutes: 20
        env:
          KEYHOLDING_PORTAL_USERNAME: ${{ secrets.KEYHOLDING_PORTAL_USERNAME || secrets.KEYHOLDING_USERNAME }}
          KEYHOLDING_PORTAL_PASSWORD: ${{ secrets.KEYHOLDING_PORTAL_PASSWORD || secrets.KEYHOLDING_PASSWORD }}
          KEYHOLDING_LOGIN_URL: ${{ secrets.KEYHOLDING_LOGIN_URL }}
          KEYHOLDING_JOBS_IMPORT_URL: ${{ secrets.KEYHOLDING_JOBS_IMPORT_URL }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
        run: node scripts/keyholding-jobs.mjs

      # Counts only in the log; saves no capture files.
      - name: FastField forms
        id: fastfield
        if: steps.due.outputs.due != 'false'
        continue-on-error: true
        timeout-minutes: 12
        env:
          FASTFIELD_USERNAME: ${{ secrets.FASTFIELD_USERNAME }}
          FASTFIELD_PASSWORD: ${{ secrets.FASTFIELD_PASSWORD }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
          FASTFIELD_MAX_MINUTES: "8"
        run: node scripts/fastfield-forms.mjs

      - name: Fail the run if any sync failed
        if: steps.due.outputs.due != 'false' && (steps.callouts.outcome != 'success' || steps.activities.outcome != 'success' || steps.keyholding.outcome != 'success' || steps.fastfield.outcome != 'success')
        run: |
          echo "Nexus callouts:   ${{ steps.callouts.outcome }}"
          echo "Nexus activities: ${{ steps.activities.outcome }}"
          echo "Keyholding jobs:  ${{ steps.keyholding.outcome }}"
          echo "FastField forms:  ${{ steps.fastfield.outcome }}"
          echo "See the failed step's log above for the reason."
          exit 1

      # Captures hold client site data, so keep them only when something
      # failed (or the run was started by hand), for 1 day.
      - name: Upload captures
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: partner-syncs-capture
          path: |
            nexus-callouts.json
            nexus-dashboard.html
            nexus-dashboard.png
            nexus-activities.json
            nexus-activities-page.html
            nexus-activities-page.png
            keyholding-jobs.json
            keyholding-jobs-page.html
            keyholding-jobs-page.png
          if-no-files-found: ignore
          retention-days: 1
