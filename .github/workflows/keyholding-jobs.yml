name: Keyholding jobs

# Reads the Keyholding Company (Chase2Base) Jobs screen for a date window and
# imports each job via /api/imports/keyholding-jobs (attached to the Keyholding
# customer, officers left to allocate, deduped by the J… job number, linked to
# the matching scheduled job / patrol visit instead of duplicating it).
#
# The scheduled run (every 4 hours: last 3 days → next 7 days) is in
# partner-syncs.yml; use this workflow by hand for a backfill (set From/To;
# tick Preview for a dry run first).
#
# Secrets: KEYHOLDING_PORTAL_USERNAME / KEYHOLDING_PORTAL_PASSWORD (login),
#          KEYHOLDING_JOBS_IMPORT_URL (…/api/imports/keyholding-jobs),
#          NEXUS_IMPORT_SECRET (shared import secret).
# With KEYHOLDING_JOBS_IMPORT_URL unset it reads + saves only (dry run).

on:
  workflow_dispatch:
    inputs:
      from:
        description: "From date (YYYY-MM-DD). Blank = 3 days ago."
        type: string
        required: false
      to:
        description: "To date (YYYY-MM-DD). Blank = 7 days ahead."
        type: string
        required: false
      preview:
        description: "Preview only (report what would change, write nothing)."
        type: boolean
        default: false

concurrency:
  group: partner-syncs # shared with partner-syncs.yml so imports never overlap
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Read + import Keyholding jobs
        env:
          KEYHOLDING_PORTAL_USERNAME: ${{ secrets.KEYHOLDING_PORTAL_USERNAME || secrets.KEYHOLDING_USERNAME }}
          KEYHOLDING_PORTAL_PASSWORD: ${{ secrets.KEYHOLDING_PORTAL_PASSWORD || secrets.KEYHOLDING_PASSWORD }}
          KEYHOLDING_LOGIN_URL: ${{ secrets.KEYHOLDING_LOGIN_URL }}
          KEYHOLDING_JOBS_IMPORT_URL: ${{ secrets.KEYHOLDING_JOBS_IMPORT_URL }}
          NEXUS_IMPORT_SECRET: ${{ secrets.NEXUS_IMPORT_SECRET }}
          KEYHOLDING_FROM: ${{ inputs.from }}
          KEYHOLDING_TO: ${{ inputs.to }}
          KEYHOLDING_PREVIEW: ${{ inputs.preview }}
        run: node scripts/keyholding-jobs.mjs

      # Manual runs only, so keep the capture for debugging — 1 day (it holds
      # client site data).
      - name: Upload jobs capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyholding-jobs
          path: |
            keyholding-jobs.json
            keyholding-jobs-page.html
            keyholding-jobs-page.png
          if-no-files-found: ignore
          retention-days: 1
